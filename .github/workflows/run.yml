name: Trading News Bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUIVER_API_TOKEN: ${{ secrets.QUIVER_API_TOKEN }}
        run: python scripts/fetch_and_notify.py

      - name: Publicar data.json actualizado
        run: |
          git config user.name "trading-news-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualiza data.json [skip ci]"
          git push
